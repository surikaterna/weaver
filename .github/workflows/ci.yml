name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo build --filter='!@weaver-conf/demo'

      - name: Typecheck
        run: pnpm exec turbo typecheck --filter='!@weaver-conf/demo'

      - run: pnpm exec turbo lint --filter='!@weaver-conf/demo'

      - run: pnpm exec turbo test --filter='!@weaver-conf/demo'
